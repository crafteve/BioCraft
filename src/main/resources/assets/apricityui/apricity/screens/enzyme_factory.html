<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="aui-viewport" content="mode=gui">
<meta name="aui-font-mode" content="web">
<meta name="aui-mouse-events" content="intercept">
<link rel="stylesheet" href="enzyme_factory.css">
</head>
<body>
    <header class="titlebar">
        <div class="abbr" id="abbr"></div>
        <div class="name" id="name"></div>
        <div class="env" id="env"></div>
    </header>

    <main class="layout">
        <container id="block_entity" bind="block_entity" class="species-area">
            <section class="column input">
                <h3 class="col-title">输入 · 底物</h3>
                <div class="scroll" id="reactants"></div>
            </section>
            <section class="column output">
                <h3 class="col-title">输出 · 产物</h3>
                <div class="scroll" id="products"></div>
            </section>
        </container>

        <section class="dashboard">
            <div class="equation" id="equation"></div>
            <div class="rate-row">
                <span class="rate-label">净速率</span>
                <span class="rate-dir" id="rate-dir"></span>
                <span class="rate-value" id="rate-value"></span>
                <span class="rate-unit">/s</span>
            </div>
            <div class="progress-row">
                <span class="progress-label">进度</span>
                <biocraft-progress id="progress"></biocraft-progress>
                <span class="progress-pct" id="progress-pct"></span>
            </div>
            <biocraft-balance id="balance"></biocraft-balance>
            <biocraft-vtchart id="vtchart"></biocraft-vtchart>
        </section>
    </main>

    <footer class="inventory">
        <container id="player" bind="player" layout="preset:player"></container>
    </footer>
</body>
</html>
